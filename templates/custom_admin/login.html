{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | Rudra Massage & Wellness</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{% static 'assets/images/rudra-wellness-logo.png' %}">

  <!-- Google Fonts: Cormorant Garamond, Plus Jakarta Sans, Alex Brush -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Bootstrap & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    :root {
      --primary-forest: #196144;
      --primary-forest-hover: #124A34;
      --primary-forest-dark: #0E3525;
      --gold-accent: #C5A059;
      --sage-light: #E7F3EC;
      --bg-cream: #F8F5EE;
      --text-dark: #1E2B24;
      --text-muted: #6B7B72;
      --border-subtle: #D9E4DD;
      --border-focus: #196144;
      --card-bg: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-dark);
      background-color: var(--bg-cream);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Main Container with Background */
    .login-viewport {
      min-height: 100vh;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #F8F6F0;
      background-image: radial-gradient(circle at 10% 20%, rgba(231, 243, 236, 0.7) 0%, transparent 45%),
      radial-gradient(circle at 90% 85%, rgba(197, 160, 89, 0.12) 0%, transparent 50%),
      url("{% static 'assets/images/admin-login-bg.jpg' %}");
      background-size: cover;
      background-position: left center;
      background-repeat: no-repeat;
      padding: 30px 20px;
    }

    /* Subtle overlay for optimal readability */
    .login-viewport::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to right,
          rgba(248, 246, 240, 0.15) 0%,
          rgba(248, 246, 240, 0.45) 45%,
          rgba(248, 246, 240, 0.85) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Top Right Tagline ("Better Care for a Healthier You") */
    .tagline-top-right {
      position: absolute;
      top: 36px;
      right: 52px;
      z-index: 2;
      text-align: right;
    }

    .tagline-text {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 1.55rem;
      font-weight: 600;
      color: #385E4D;
      line-height: 1.2;
      letter-spacing: 0.02em;
    }

    .tagline-flourish {
      width: 60px;
      height: 2px;
      background: linear-gradient(to right, transparent, #385E4D);
      margin-left: auto;
      margin-top: 6px;
      border-radius: 2px;
    }

    /* Bottom Right Watermark Petal */
    .watermark-petal {
      position: absolute;
      bottom: -40px;
      right: -20px;
      width: 320px;
      height: 320px;
      opacity: 0.055;
      pointer-events: none;
      z-index: 1;
    }

    /* Content Layout Grid */
    .login-content-grid {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1220px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 40px;
    }

    /* Left Branding Section */
    .brand-hero-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .brand-logo-hero {
      width: 100%;
      max-width: 340px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.08));
      transition: transform 0.3s ease;
    }

    .brand-logo-hero:hover {
      transform: translateY(-2px);
    }

    .brand-motto {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 1.4rem;
      font-weight: 600;
      color: #325644;
      margin-top: 14px;
      letter-spacing: 0.06em;
    }

    .brand-motto span {
      margin: 0 8px;
      color: var(--gold-accent);
    }

    /* Right Login Card */
    .card-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .admin-login-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 24px;
      padding: 42px 38px 36px 38px;
      border: 1px solid rgba(217, 228, 221, 0.7);
      box-shadow:
        0 10px 25px -5px rgba(24, 75, 52, 0.06),
        0 25px 50px -12px rgba(0, 0, 0, 0.12);
      transition: box-shadow 0.3s ease;
    }

    .admin-login-card:hover {
      box-shadow:
        0 12px 30px -5px rgba(24, 75, 52, 0.08),
        0 30px 60px -12px rgba(0, 0, 0, 0.16);
    }

    /* Badge */
    .admin-role-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 16px;
      background-color: var(--sage-light);
      color: var(--primary-forest);
      font-size: 0.73rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .admin-role-badge i {
      font-size: 0.85rem;
    }

    /* Card Heading */
    .card-title-portal {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.15rem;
      font-weight: 700;
      color: var(--primary-forest-dark);
      letter-spacing: -0.01em;
      line-height: 1.15;
      margin-bottom: 6px;
    }

    .card-subtitle-portal {
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 400;
      margin-bottom: 26px;
    }

    /* Form Fields */
    .form-group-field {
      margin-bottom: 20px;
      text-align: left;
    }

    .field-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.84rem;
      font-weight: 700;
      color: #27362E;
      margin-bottom: 8px;
    }

    .field-label i {
      font-size: 0.88rem;
      color: #385E4D;
    }

    .input-box-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-left {
      position: absolute;
      left: 16px;
      color: #8C9991;
      font-size: 1.05rem;
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .custom-input {
      width: 100%;
      height: 48px;
      padding: 10px 44px 10px 44px;
      background-color: #FAFCFA;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      font-size: 0.92rem;
      color: var(--text-dark);
      transition: all 0.2s ease;
      outline: none;
    }

    .custom-input::placeholder {
      color: #9EABA3;
      font-weight: 400;
    }

    .custom-input:focus {
      background-color: #FFFFFF;
      border-color: var(--primary-forest);
      box-shadow: 0 0 0 3.5px rgba(25, 97, 68, 0.12);
    }

    .input-box-wrapper:focus-within .input-icon-left {
      color: var(--primary-forest);
    }

    /* Toggle Password Button */
    .toggle-password-btn {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: #8C9991;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
    }

    .toggle-password-btn:hover {
      color: var(--primary-forest);
    }

    /* Submit Button */
    .btn-submit-admin {
      width: 100%;
      height: 48px;
      background-color: var(--primary-forest);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 26px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(25, 97, 68, 0.28);
      transition: all 0.25s ease;
    }

    .btn-submit-admin:hover {
      background-color: var(--primary-forest-hover);
      box-shadow: 0 6px 20px rgba(25, 97, 68, 0.35);
      transform: translateY(-1px);
      color: #FFFFFF;
    }

    .btn-submit-admin:active {
      transform: translateY(0);
      box-shadow: 0 2px 10px rgba(25, 97, 68, 0.25);
    }

    /* Ornamental Divider with Shield Icon */
    .ornamental-divider {
      position: relative;
      text-align: center;
      margin: 24px 0 20px 0;
    }

    .ornamental-divider::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background-color: #E2ECE5;
      z-index: 1;
    }

    .divider-shield-icon {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--card-bg);
      padding: 0 12px;
      color: var(--primary-forest);
      font-size: 0.82rem;
    }

    /* Return to Public Website Link */
    .return-public-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--primary-forest);
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .return-public-link i {
      font-size: 0.95rem;
      transition: transform 0.2s ease;
    }

    .return-public-link:hover {
      color: var(--primary-forest-hover);
      text-decoration: none;
    }

    .return-public-link:hover i {
      transform: translateX(-3px);
    }

    /* Messages & Alerts */
    .alert-custom {
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.84rem;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    /* Responsive Adjustments */
    @media (max-width: 991px) {
      .login-content-grid {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .brand-hero-section {
        display: none;
      }

      .tagline-top-right {
        top: 20px;
        right: 24px;
      }

      .tagline-text {
        font-size: 1.25rem;
      }

      .login-viewport {
        background-position: center;
        padding: 40px 16px;
      }

      .mobile-brand-header {
        display: block !important;
        text-align: center;
        margin-bottom: 20px;
      }
    }

    @media (min-width: 992px) {
      .mobile-brand-header {
        display: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="login-viewport">

    <!-- Top Right Aesthetic Tagline ("Better Care for a Healthier You") -->
    <div class="tagline-top-right">
      <div class="tagline-text">Better Care<br>for a Healthier<br>You</div>
      <div class="tagline-flourish"></div>
    </div>

    <!-- Decorative Watermark Petal (Bottom Right) -->
    <svg class="watermark-petal" viewBox="0 0 100 100" fill="currentColor">
      <path d="M50 0 C65 25 80 40 100 50 C80 60 65 75 50 100 C35 75 20 60 0 50 C20 40 35 25 50 0 Z" />
    </svg>

    <!-- Main Content Container -->
    <div class="login-content-grid">

      <!-- Left Side: Official Rudra Branding Composition -->
      <div class="brand-hero-section">
        <a href="{% url 'user:home' %}" title="Rudra Massage & Wellness Home">
          <img src="{% static 'assets/images/rudra-wellness-logo.png' %}" alt="Rudra Massage & Wellness"
            class="brand-logo-hero">
        </a>
        <div class="brand-motto">
          Health <span>·</span> Harmony <span>·</span> Happiness
        </div>
      </div>

      <!-- Right Side: The Management Portal Login Card -->
      <div class="card-wrapper">
        <div class="admin-login-card">

          <!-- Mobile Brand Header (shown on mobile/tablet) -->
          <div class="mobile-brand-header">
            <a href="{% url 'user:home' %}">
              <img src="{% static 'assets/images/rudra-wellness-logo.png' %}" alt="Rudra Logo"
                style="height: 64px; width: auto; object-fit: contain;">
            </a>
          </div>

          <!-- Title -->
          <div class="text-center mb-4">
            <h1 class="card-title-portal mb-0">Admin Portal</h1>
          </div>

          <!-- Django Flash Messages -->
          {% if messages %}
          {% for message in messages %}
          <div
            class="alert-custom {% if message.tags == 'error' %}alert alert-danger{% elif message.tags == 'success' %}alert alert-success{% else %}alert alert-info{% endif %} alert-dismissible fade show"
            role="alert">
            <i
              class="bi {% if message.tags == 'error' %}bi-exclamation-triangle-fill{% elif message.tags == 'success' %}bi-check-circle-fill{% else %}bi-info-circle-fill{% endif %}"></i>
            <div class="flex-grow-1">{{ message }}</div>
            <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert" aria-label="Close"
              style="padding: 8px;"></button>
          </div>
          {% endfor %}
          {% endif %}

          <!-- Login Form -->
          <form method="post" action="{% url 'custom_admin:login' %}">
            {% csrf_token %}
            {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <!-- Staff Username -->
            <div class="form-group-field">
              <label for="adminUsername" class="field-label">
                <i class="bi bi-person-fill"></i> Admin Username
              </label>
              <div class="input-box-wrapper">
                <i class="bi bi-person input-icon-left"></i>
                <input type="text" name="username" id="adminUsername" class="custom-input"
                  placeholder="Enter your username" autocomplete="username" required autofocus>
              </div>
            </div>

            <!-- Password with Show/Hide Eye Toggle -->
            <div class="form-group-field">
              <label for="adminPassword" class="field-label">
                <i class="bi bi-lock-fill"></i> Password
              </label>
              <div class="input-box-wrapper">
                <i class="bi bi-lock input-icon-left"></i>
                <input type="password" name="password" id="adminPassword" class="custom-input"
                  placeholder="Enter your password" autocomplete="current-password" required>
                <button type="button" class="toggle-password-btn" id="togglePasswordBtn"
                  aria-label="Toggle password visibility" title="Show/Hide password">
                  <i class="bi bi-eye-slash" id="togglePasswordIcon"></i>
                </button>
              </div>
            </div>

            <!-- Sign In Submit Button -->
            <button type="submit" class="btn-submit-admin">
              <i class="bi bi-box-arrow-in-right"></i> Sign In
            </button>

            <!-- Ornamental Divider with Shield -->
            <div class="ornamental-divider">
              <span class="divider-shield-icon">
                <i class="bi bi-shield-fill-check"></i>
              </span>
            </div>

            <!-- Return to Public Site Link -->
            <div class="text-center">
              <a href="{% url 'user:home' %}" class="return-public-link">
                <i class="bi bi-arrow-left"></i> Return to Public Website
              </a>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>

  <!-- Password Show/Hide Script -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const toggleBtn = document.getElementById("togglePasswordBtn");
      const passwordInput = document.getElementById("adminPassword");
      const toggleIcon = document.getElementById("togglePasswordIcon");

      if (toggleBtn && passwordInput && toggleIcon) {
        toggleBtn.addEventListener("click", function () {
          const isPassword = passwordInput.getAttribute("type") === "password";
          if (isPassword) {
            passwordInput.setAttribute("type", "text");
            toggleIcon.classList.remove("bi-eye-slash");
            toggleIcon.classList.add("bi-eye");
            toggleBtn.setAttribute("title", "Hide password");
          } else {
            passwordInput.setAttribute("type", "password");
            toggleIcon.classList.remove("bi-eye");
            toggleIcon.classList.add("bi-eye-slash");
            toggleBtn.setAttribute("title", "Show password");
          }
        });
      }
    });
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
