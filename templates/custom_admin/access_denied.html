{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied | Rudra Massage & Wellness Admin</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/admin.css' %}">
  <style>
    .denied-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--background, #FAFCFA);
      padding: 24px;
    }
    .denied-card {
      max-width: 480px;
      background: #FFFFFF;
      border: 1px solid var(--border, #E4EAE6);
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body>
  <div class="denied-wrapper">
    <div class="denied-card">
      <div class="text-danger mb-3" style="font-size: 3rem;">
        <i class="bi bi-shield-x"></i>
      </div>
      <h2 class="h4 fw-bold mb-2">Staff Authorization Required</h2>
      <p class="text-muted small mb-4">
        You are currently logged in as <strong>{{ user.username }}</strong>, but this account does not possess staff privileges required to access the Rudra administration console.
      </p>
      <div class="d-flex flex-column gap-2">
        <form method="post" action="{% url 'custom_admin:logout' %}">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-danger w-100 py-2 small fw-semibold">
            <i class="bi bi-box-arrow-right me-1"></i> Log Out & Sign in with Staff Account
          </button>
        </form>
        <a href="{% url 'user:home' %}" class="btn btn-outline-secondary w-100 py-2 small">
          <i class="bi bi-house me-1"></i> Return to Public Website
        </a>
      </div>
    </div>
  </div>
</body>
</html>
